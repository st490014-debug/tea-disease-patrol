# 1. Workflow 名稱
name: 南投病害偵茶隊 - 程式碼自動檢查

# 2. Trigger：當有人 push 程式碼到 main 分支時觸發
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 3. Jobs：要執行的任務
jobs:
  python-lint-and-test:
    # 告訴 GitHub 在雲端開一台 Linux 虛擬機器給我們用
    runs-on: ubuntu-latest

    # 4. Steps：具體步驟
    steps:
    # 步驟一：把專案的程式碼下載到雲端機器上
    - name: 下載 GitHub 專案程式碼
      uses: actions/checkout@v4

    # 步驟二：安裝專案指定的 Python 3.10 環境
    - name: 設定 Python 3.10 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步驟三：安裝基礎依賴套件（如 requests, opencv 等）
    - name: 安裝基本套件
      run: |
        python -m pip install --upgrade pip
        pip install requests flake8

    # 步驟四：使用 flake8 檢查是否有基本的 Python 語法錯誤
    - name: 檢查 Python 語法錯誤
      run: |
        # 檢查是否有致命語法錯誤或未定義的變數
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
# 步驟五：真正執行氣象服務程式碼並帶入 Secrets 密鑰
    - name: 測試執行 CWA 氣象抓取程式
      env:
        CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      run: |
        python cwa_service.py

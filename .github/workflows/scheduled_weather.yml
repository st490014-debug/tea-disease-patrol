name: 南投病害偵茶隊 - 定時自動抓取氣象資料

on:
  # 1. 定時觸發：每天台灣時間早上 8 點（即 UTC 00:00）自動執行
  schedule:
    - cron: '0 0 * * *'

  # 2. 手動觸發：新增這個設定，讓我們隨時可以在網頁上按按鈕手動測試，不用死等時間到！
  workflow_dispatch:

jobs:
  fetch-weather-job:
    runs-on: ubuntu-latest

    steps:
    - name: 下載專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 執行氣象抓取腳本
      env:
        CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      run: |
        python cwa_service.py
